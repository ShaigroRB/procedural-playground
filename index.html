<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Spider</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #efe9de 0%, #ddd5c6 70%, #cfc6b5 100%);
    cursor: crosshair;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hint {
    position: fixed; left: 16px; bottom: 14px;
    font: 13px/1.4 system-ui, sans-serif; color: #7a6d5c;
    user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Move the mouse — the spider follows. Scroll to resize · <b>D</b> toggles debug view</div>
<script>
'use strict';

// ---------- setup ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
}
resize();
addEventListener('resize', resize);

const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------- input ----------
const mouse = { x: W / 2, y: H / 2 };
const setMouse = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
addEventListener('pointermove', setMouse);
addEventListener('pointerdown', setMouse);

let S = 1.1; // spider scale
addEventListener('wheel', e => { S = clamp(S * Math.exp(-e.deltaY * 0.001), 0.45, 2.6); }, { passive: true });
let debug = false;
addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') debug = !debug; });

// ---------- spider ----------
const spider = {
  x: W / 2, y: H / 2, vx: 0, vy: 0,
  a: -Math.PI / 2, av: 0,       // heading + angular velocity
  abd: 0,                      // abdomen lag angle
  offX: 0, offY: 0,            // body sway toward support polygon
  z: 18,                       // body height (for shadow)
  idle: 0, pause: 0, time: 0,
};

// Per-leg geometry (angles in degrees from "forward", mirrored for left/right)
const DEFS = [
  { hip: 38,  rest: 36,  dist: 94, l1: 54, l2: 62 },
  { hip: 68,  rest: 76,  dist: 82, l1: 47, l2: 53 },
  { hip: 108, rest: 118, dist: 74, l1: 42, l2: 48 },
  { hip: 142, rest: 154, dist: 90, l1: 52, l2: 58 },
];
const HIP_RX = 10, HIP_RY = 8.5;

const legs = [];
for (const side of [-1, 1]) for (let i = 0; i < 4; i++) {
  legs.push({
    side, i, d: DEFS[i],
    foot: { x: 0, y: 0 }, from: { x: 0, y: 0 }, jit: { x: 0, y: 0 },
    ideal: { x: 0, y: 0 }, rest: { x: 0, y: 0 }, err: 0,
    stepping: false, t: 0, dur: 0.15, lift: 0, liftH: 10, tapTarget: null,
  });
}
// neighbours: adjacent legs on the same side + the mirrored leg -> they never lift together
for (const L of legs) {
  L.nb = legs.filter(o => o !== L &&
    ((o.side === L.side && Math.abs(o.i - L.i) === 1) || (o.side !== L.side && o.i === L.i)));
}

function toWorld(lx, ly, px = spider.x, py = spider.y, a = spider.a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: px + lx * c - ly * s, y: py + lx * s + ly * c };
}
function hipLocal(L) {
  const ang = L.d.hip * D2R;
  return { x: Math.cos(ang) * HIP_RX * S, y: L.side * Math.sin(ang) * HIP_RY * S };
}
function restLocal(L) {
  const ang = L.d.rest * D2R;
  return { x: Math.cos(ang) * L.d.dist * S + 2 * S, y: L.side * Math.sin(ang) * L.d.dist * S };
}

for (const L of legs) {
  const r = restLocal(L);
  L.foot = toWorld(r.x, r.y);
}

const prints = []; // fading footprints

function startStep(L, speed, tapTarget = null) {
  const sp = speed / S;
  L.stepping = true;
  L.t = 0;
  L.from = { x: L.foot.x, y: L.foot.y };
  L.tapTarget = tapTarget;
  if (tapTarget) {
    L.dur = rand(0.22, 0.32);
    L.liftH = rand(14, 22) * S;
  } else {
    L.dur = clamp(0.22 - sp * 0.0004, 0.075, 0.22) * rand(0.9, 1.1);
    L.liftH = (8 + sp * 0.04) * S;
  }
  L.jit = { x: rand(-3, 3) * S, y: rand(-3, 3) * S };
}

// cheap smooth 1D noise
const noise = t => (Math.sin(t * 1.3) + 0.6 * Math.sin(t * 2.9 + 1.7) + 0.3 * Math.sin(t * 5.3 + 4.1)) / 1.9;

function update(dt) {
  spider.time += dt;
  const t = spider.time;

  // --- locomotion: steer toward the cursor ---
  const dx = mouse.x - spider.x, dy = mouse.y - spider.y;
  const d = Math.hypot(dx, dy);
  let speed = Math.hypot(spider.vx, spider.vy);

  const maxSpeed = 340 * S * (0.85 + 0.25 * noise(t * 0.8));
  let desired = d > 4 * S ? maxSpeed * Math.sqrt(clamp((d - 4 * S) / (150 * S), 0, 1)) : 0;

  // occasional hesitation: real spiders move in bursts
  if (spider.pause > 0) spider.pause -= dt;
  else if (speed > 110 * S && Math.random() < dt * 0.25) spider.pause = rand(0.12, 0.45);
  if (spider.pause > 0) desired = 0;

  const targetAng = Math.atan2(dy, dx);
  const diff = angDiff(spider.a, targetAng);
  const wantAv = d > 12 * S ? clamp(diff * 8, -9, 9) : 0;
  spider.av = lerp(spider.av, wantAv, clamp(dt * 10, 0, 1));
  spider.a += spider.av * dt;

  // walk mostly forward, slow down while turning sharply
  desired *= 0.2 + 0.8 * clamp(Math.cos(diff), 0, 1);
  let mx = 0, my = 0;
  if (d > 0.001) {
    mx = Math.cos(spider.a) * 0.6 + (dx / d) * 0.4;
    my = Math.sin(spider.a) * 0.6 + (dy / d) * 0.4;
    const m = Math.hypot(mx, my) || 1; mx /= m; my /= m;
  }
  const k = clamp(dt * (desired < speed ? 9 : 4), 0, 1);
  spider.vx = lerp(spider.vx, mx * desired, k);
  spider.vy = lerp(spider.vy, my * desired, k);
  spider.x += spider.vx * dt;
  spider.y += spider.vy * dt;
  speed = Math.hypot(spider.vx, spider.vy);

  if (speed < 8 * S && Math.abs(spider.av) < 0.3) spider.idle += dt; else spider.idle = 0;

  // --- legs: decide where each foot "wants" to be ---
  const th = 22 * S + speed * 0.16;                 // step trigger distance
  const lead = Math.min(1, speed / (40 * S)) * th * 0.5;
  const vdx = speed > 0.01 ? spider.vx / speed : 0, vdy = speed > 0.01 ? spider.vy / speed : 0;

  for (const L of legs) {
    const r = restLocal(L);
    L.rest = toWorld(r.x, r.y);
    const hl = hipLocal(L), hip = toWorld(hl.x, hl.y, spider.x + spider.offX, spider.y + spider.offY);
    const reach = (L.d.l1 + L.d.l2) * S;
    let ix = L.rest.x + vdx * lead, iy = L.rest.y + vdy * lead;
    // never aim a step beyond what the leg can comfortably reach
    const ox = ix - hip.x, oy = iy - hip.y, m = Math.hypot(ox, oy);
    if (m > reach * 0.82) { ix = hip.x + ox / m * reach * 0.82; iy = hip.y + oy / m * reach * 0.82; }
    L.ideal = { x: ix, y: iy };
    L.err = dist(L.foot, L.ideal);
    L.strain = dist(hip, L.foot) / reach;
  }

  // --- gait: biggest-error legs step first, but never next to a lifted neighbour ---
  const cands = legs.filter(L => !L.stepping && (L.err > th || L.strain > 0.84)).sort((a, b) => b.err - a.err);
  for (const L of cands) {
    if (L.err > th * 1.8 || L.strain > 0.9 || !L.nb.some(n => n.stepping)) startStep(L, speed);
  }

  // --- idle: settle feet one at a time, and occasionally "taste" the ground ---
  if (spider.idle > 0.25) {
    for (const L of legs) {
      if (!L.stepping && L.err > 3 * S && !L.nb.some(n => n.stepping) && Math.random() < dt * 5) {
        startStep(L, 0);
      }
    }
  }
  if (spider.idle > 1.5 && Math.random() < dt * 0.45) {
    const pool = legs.filter(L => L.i <= (Math.random() < 0.8 ? 0 : 1));
    const L = pool[Math.floor(Math.random() * pool.length)];
    if (!L.stepping && !L.nb.some(n => n.stepping)) {
      const r = restLocal(L);
      const tgt = toWorld(r.x + rand(8, 20) * S, r.y + L.side * rand(-6, 8) * S);
      startStep(L, 0, tgt);
    }
  }

  // --- animate steps ---
  let lifted = 0;
  for (const L of legs) {
    if (!L.stepping) continue;
    lifted++;
    L.t += dt / L.dur;
    const target = L.tapTarget || { x: L.ideal.x + L.jit.x, y: L.ideal.y + L.jit.y };
    if (L.t >= 1) {
      L.foot = { x: target.x, y: target.y };
      L.stepping = false;
      L.lift = 0;
      L.tapTarget = null;
      prints.push({ x: L.foot.x, y: L.foot.y, life: 1, r: 1.6 * S });
      if (prints.length > 260) prints.shift();
    } else {
      const e = smooth(L.t);
      L.foot.x = lerp(L.from.x, target.x, e);
      L.foot.y = lerp(L.from.y, target.y, e);
      L.lift = Math.sin(Math.PI * L.t) * L.liftH;
    }
  }

  // --- body follows its support: sway toward planted feet, dip when legs are lifted ---
  let ax = 0, ay = 0, n = 0;
  for (const L of legs) if (!L.stepping) { ax += L.foot.x - L.rest.x; ay += L.foot.y - L.rest.y; n++; }
  if (n) { ax /= n; ay /= n; }
  spider.offX = lerp(spider.offX, ax * 0.18, clamp(dt * 8, 0, 1));
  spider.offY = lerp(spider.offY, ay * 0.18, clamp(dt * 8, 0, 1));
  const breathe = Math.sin(t * 2.3);
  spider.z = lerp(spider.z, (18 + breathe * 1.2 - lifted * 0.8) * S, clamp(dt * 10, 0, 1));
  spider.abd = lerp(spider.abd, clamp(-spider.av * 0.1, -0.35, 0.35), clamp(dt * 4, 0, 1));

  for (const p of prints) p.life -= dt * 0.25;
  while (prints.length && prints[0].life <= 0) prints.shift();
}

// ---------- rendering ----------
const LIGHT = { x: 0.45, y: 0.7 }; // shadow offset per unit height
const LEG_COL = '#1e1611';

function legPoints(L, bx, by) {
  const hl = hipLocal(L);
  const hip = toWorld(hl.x, hl.y, bx, by);
  let fx = L.foot.x, fy = L.foot.y;
  // while swinging, the leg folds a little toward the body
  if (L.lift > 0) {
    const ox = hip.x - fx, oy = hip.y - fy, m = Math.hypot(ox, oy) || 1;
    fx += ox / m * L.lift * 0.3; fy += oy / m * L.lift * 0.3;
  }
  const l1 = L.d.l1 * S, l2 = L.d.l2 * S;
  // a swinging (airborne) foot is dragged along rather than over-stretching the leg
  if (L.stepping) {
    const ox = fx - hip.x, oy = fy - hip.y, m = Math.hypot(ox, oy), maxR = (l1 + l2) * 0.97;
    if (m > maxR) { fx = hip.x + ox / m * maxR; fy = hip.y + oy / m * maxR; }
  }
  let ddx = fx - hip.x, ddy = fy - hip.y;
  let dd = Math.hypot(ddx, ddy) || 0.001;
  const ux = ddx / dd, uy = ddy / dd;
  const dc = clamp(dd, Math.abs(l1 - l2) + 1, l1 + l2 - 0.5);
  const a = (l1 * l1 - l2 * l2 + dc * dc) / (2 * dc);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  // front legs: knees point out & back (elbows); rear legs: out & forward
  const sign = L.side * (L.i < 2 ? 1 : -1);
  const nx = -uy * sign, ny = ux * sign;
  const knee = { x: hip.x + ux * a + nx * h, y: hip.y + uy * a + ny * h };
  const foot = { x: fx, y: fy };
  const mid = {
    x: lerp(knee.x, foot.x, 0.5) + nx * 2.5 * S,
    y: lerp(knee.y, foot.y, 0.5) + ny * 2.5 * S,
  };
  const kneeZ = spider.z + 10 * S + h * 0.35;
  return { hip, knee, mid, foot, z: [spider.z, kneeZ, (kneeZ + L.lift) * 0.5, L.lift] };
}

// All legs are batched: one path per segment width -> 3 strokes for all 8 legs.
const WIDTHS = [4.5, 3, 1.8];
function strokeLegs(pts, off, color) {
  ctx.strokeStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let j = 0; j < 3; j++) {
    ctx.lineWidth = WIDTHS[j] * S;
    ctx.beginPath();
    for (const P of pts) {
      const a = P.chain[j], b = P.chain[j + 1];
      const za = off ? P.z[j] : 0, zb = off ? P.z[j + 1] : 0;
      ctx.moveTo(a.x + LIGHT.x * za, a.y + LIGHT.y * za);
      ctx.lineTo(b.x + LIGHT.x * zb, b.y + LIGHT.y * zb);
    }
    ctx.stroke();
  }
}

function ellipse(c, x, y, rx, ry, rot = 0) {
  c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU);
}

function drawBody(bx, by, shadow) {
  const t = spider.time;
  const c = ctx;
  c.save();
  c.translate(bx, by);
  c.rotate(spider.a);
  c.scale(S, S);
  const fill = shadow ? 'rgba(60,40,20,0.18)' : LEG_COL;

  // pedipalps
  if (!shadow) {
    const moving = Math.hypot(spider.vx, spider.vy) > 20 * S;
    c.strokeStyle = LEG_COL; c.lineCap = 'round'; c.lineWidth = 2.4;
    c.beginPath();
    for (const side of [-1, 1]) {
      const w = moving ? Math.sin(t * 14 + side) * 1.6 : Math.sin(t * 2.7 + side * 1.3) * 1.2 + Math.max(0, Math.sin(t * 0.9 + side)) * 2;
      c.moveTo(10, side * 5.5);
      c.lineTo(17 + w * 0.5, side * (8.5 + w));
      c.lineTo(23 + w, side * (6 + w * 0.6));
    }
    c.stroke();
  }

  // abdomen (lags behind turns, breathes)
  c.save();
  c.translate(-9, 0);
  c.rotate(spider.abd);
  const br = Math.sin(t * 2.3);
  c.fillStyle = fill;
  ellipse(c, -18, 0, 21 * (1 + 0.03 * br), 16 * (1 + 0.045 * br)); c.fill();
  if (!shadow) {
    // simple marking
    c.strokeStyle = '#6b5440'; c.lineWidth = 1.5; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    for (let k = 0; k < 3; k++) {
      const x = -9 - k * 7, h = 6 - k * 1.3;
      c.moveTo(x - 4, -h); c.lineTo(x, 0); c.lineTo(x - 4, h);
    }
    c.stroke();
  }
  c.restore();

  // cephalothorax
  c.fillStyle = fill;
  ellipse(c, 0, 0, 13.5, 11.5); c.fill();
  if (!shadow) {
    c.fillStyle = '#2f231a'; ellipse(c, 1, 0, 9, 7.5); c.fill();
    // eyes
    c.fillStyle = '#000';
    c.beginPath();
    for (const sd of [-1, 1]) {
      c.moveTo(11.7, sd * 2.4); c.arc(9.6, sd * 2.4, 2.1, 0, TAU);
      c.moveTo(10.1, sd * 5.2); c.arc(8.8, sd * 5.2, 1.3, 0, TAU);
    }
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.8)';
    c.beginPath();
    for (const sd of [-1, 1]) { c.moveTo(10.9, sd * 2.4 - 0.7); c.arc(10.2, sd * 2.4 - 0.7, 0.7, 0, TAU); }
    c.fill();
  }
  c.restore();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // footprints
  ctx.fillStyle = 'rgb(70,52,36)';
  for (const p of prints) {
    ctx.globalAlpha = 0.14 * p.life;
    ellipse(ctx, p.x, p.y, p.r, p.r); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const bx = spider.x + spider.offX, by = spider.y + spider.offY;
  const pts = legs.map(L => {
    const P = legPoints(L, bx, by);
    P.chain = [P.hip, P.knee, P.mid, P.foot];
    return P;
  });

  // flat shadows, offset by height (lifted feet separate from their shadow)
  strokeLegs(pts, true, 'rgba(60,40,20,0.16)');
  drawBody(bx + LIGHT.x * spider.z, by + LIGHT.y * spider.z, true);

  // legs + body
  strokeLegs(pts, false, LEG_COL);
  if (debug) strokeLegs(pts.filter((_, k) => legs[k].stepping), false, '#b5452e');
  drawBody(bx, by, false);

  if (debug) {
    const speed = Math.hypot(spider.vx, spider.vy);
    const th = 22 * S + speed * 0.16;
    ctx.lineWidth = 1;
    for (const L of legs) {
      ctx.strokeStyle = 'rgba(40,110,200,0.35)';
      ellipse(ctx, L.ideal.x, L.ideal.y, th, th); ctx.stroke();
      ctx.fillStyle = '#2a6ec8'; ellipse(ctx, L.ideal.x, L.ideal.y, 2.5, 2.5); ctx.fill();
      ctx.strokeStyle = 'rgba(42,110,200,0.6)';
      ctx.beginPath(); ctx.moveTo(L.ideal.x, L.ideal.y); ctx.lineTo(L.foot.x, L.foot.y); ctx.stroke();
    }
    ctx.fillStyle = '#c33'; ellipse(ctx, mouse.x, mouse.y, 3, 3); ctx.fill();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
